<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>FreshBite — Summer Crunch Hunt</title>
<meta name="description" content="FreshBite Brand Memory Match — match snack pairs, beat the clock, win a coupon.">
<meta name="theme-color" content="#FF6B2C">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Crunch Hunt">
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Manrope:wght@400;600;800&family=Space+Mono:wght@400;700&display=swap');

:root{
  --cream:#FBF3E5;
  --ink:#2B2620;
  --orange:#FF6B2C;
  --orange-deep:#E0551A;
  --lime:#B8D93B;
  --berry:#E63E5C;
  --gold:#F0A202;
  --card-back:#FFFFFF;
  --shadow: 0 6px 0 rgba(43,38,32,0.18);
  --radius: 22px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(circle at 15% 10%, rgba(184,217,59,0.35), transparent 40%),
    radial-gradient(circle at 85% 90%, rgba(255,107,44,0.25), transparent 45%),
    var(--cream);
  font-family:'Manrope',sans-serif;
  color:var(--ink);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 12px;
}

.console{
  width:100%;
  max-width:460px;
  background:var(--cream);
  border:3px solid var(--ink);
  border-radius:32px;
  box-shadow: 0 14px 0 rgba(43,38,32,0.15), 0 20px 40px rgba(43,38,32,0.25);
  overflow:hidden;
  position:relative;
}

/* HUD */
.hud{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 16px;
  background:var(--ink);
  color:var(--cream);
}
.hud .brand{
  font-family:'Baloo 2',sans-serif;
  font-weight:800;
  font-size:19px;
  letter-spacing:0.3px;
  display:flex;
  align-items:center;
  gap:8px;
}
.hud .brand .dot{width:9px;height:9px;background:var(--lime);border-radius:50%;display:inline-block;}
.hud .stats{
  display:flex;
  gap:14px;
  font-family:'Space Mono',monospace;
  font-size:13px;
}
.hud .stats span b{display:block;font-size:15px;color:var(--gold);}
.mute-btn{
  background:none;border:none;color:var(--cream);cursor:pointer;font-size:16px;opacity:0.75;padding:2px;
}
.mute-btn:hover{opacity:1;}

/* Screen area */
.screen{
  min-height:520px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:26px 22px;
  text-align:center;
  position:relative;
}

.eyebrow{
  font-family:'Space Mono',monospace;
  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--orange-deep);
  margin-bottom:6px;
  font-weight:700;
}
h1.title{
  font-family:'Baloo 2',sans-serif;
  font-size:32px;
  font-weight:800;
  margin:0 0 10px;
  line-height:1.1;
}
p.lede{
  font-size:15px;
  line-height:1.5;
  color:#5b5347;
  max-width:320px;
  margin:0 0 22px;
}

.pouch-emoji{font-size:64px; margin-bottom:6px; filter: drop-shadow(0 6px 0 rgba(43,38,32,0.12));}

.btn{
  font-family:'Baloo 2',sans-serif;
  font-weight:700;
  font-size:17px;
  background:var(--orange);
  color:white;
  border:none;
  border-radius:16px;
  padding:14px 30px;
  cursor:pointer;
  box-shadow:var(--shadow);
  transition:transform 0.08s ease;
}
.btn:hover{transform:translateY(-2px);}
.btn:active{transform:translateY(2px); box-shadow:0 2px 0 rgba(43,38,32,0.18);}
.btn.secondary{
  background:var(--cream);
  color:var(--ink);
  border:2px solid var(--ink);
  box-shadow:0 4px 0 rgba(43,38,32,0.18);
  margin-top:10px;
  font-size:14px;
  padding:10px 22px;
}

.rules-list{
  text-align:left;
  font-size:14px;
  line-height:1.7;
  color:#5b5347;
  background:white;
  border:2px solid var(--ink);
  border-radius:16px;
  padding:16px 20px;
  margin-bottom:22px;
  max-width:320px;
}
.rules-list b{color:var(--ink);}

/* Game grid */
.game-wrap{width:100%;}
.game-topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
  font-family:'Space Mono',monospace;
  font-size:13px;
}
.timer-pill{
  background:var(--ink);
  color:var(--cream);
  padding:6px 14px;
  border-radius:999px;
  font-weight:700;
}
.timer-pill.low{background:var(--berry); animation:pulse 0.6s infinite alternate;}
@keyframes pulse{from{transform:scale(1);}to{transform:scale(1.06);}}
.combo-pill{
  background:var(--lime);
  color:var(--ink);
  padding:6px 14px;
  border-radius:999px;
  font-weight:700;
  opacity:0;
  transition:opacity 0.2s;
}
.combo-pill.show{opacity:1;}

.grid{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:10px;
  width:100%;
}
.card{
  aspect-ratio:1/1;
  perspective:600px;
  cursor:pointer;
}
.card-inner{
  position:relative;
  width:100%;height:100%;
  transform-style:preserve-3d;
  transition:transform 0.35s ease;
  border-radius:14px;
}
.card.flipped .card-inner, .card.matched .card-inner{transform:rotateY(180deg);}
.card-face{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  border-radius:14px;
  backface-visibility:hidden;
  border:2px solid var(--ink);
}
.card-front{
  background:repeating-linear-gradient(135deg, var(--orange), var(--orange) 8px, var(--orange-deep) 8px, var(--orange-deep) 16px);
}
.card-front::after{
  content:"?";
  font-family:'Baloo 2',sans-serif;
  font-size:26px;
  font-weight:800;
  color:rgba(255,255,255,0.85);
}
.card-back{
  background:white;
  font-size:34px;
  transform:rotateY(180deg);
}
.card.matched .card-back{
  background:var(--lime);
  animation:pop 0.3s ease;
}
@keyframes pop{0%{transform:rotateY(180deg) scale(0.85);}100%{transform:rotateY(180deg) scale(1);}}
.card.wrong .card-inner{animation:shake 0.35s;}
@keyframes shake{
  0%,100%{transform:rotateY(180deg) translateX(0);}
  25%{transform:rotateY(180deg) translateX(-6px);}
  75%{transform:rotateY(180deg) translateX(6px);}
}

/* Reward / ticket */
.ticket{
  background:white;
  border:2px dashed var(--ink);
  border-radius:14px;
  padding:18px 20px;
  margin:14px 0 20px;
  position:relative;
  width:100%;
  max-width:300px;
}
.ticket .label{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1.5px;color:#8a8171;text-transform:uppercase;}
.ticket .code{
  font-family:'Space Mono',monospace;
  font-weight:700;
  font-size:22px;
  color:var(--berry);
  letter-spacing:2px;
  margin-top:4px;
}
.confetti-layer{position:absolute; inset:0; pointer-events:none; overflow:hidden;}
.confetti-piece{
  position:absolute; top:-10px; width:8px; height:14px; opacity:0.9;
  animation:fall linear forwards;
}
@keyframes fall{
  to{ transform:translateY(560px) rotate(540deg); opacity:0.2; }
}

.score-breakdown{
  text-align:left;
  font-family:'Space Mono',monospace;
  font-size:13px;
  background:white;
  border:2px solid var(--ink);
  border-radius:14px;
  padding:14px 18px;
  width:100%;
  max-width:300px;
  margin-bottom:18px;
}
.score-breakdown .row{display:flex;justify-content:space-between;padding:3px 0;}
.score-breakdown .row.total{border-top:1px dashed var(--ink); margin-top:6px; padding-top:8px; font-weight:700; color:var(--orange-deep);}

.analytics-note{
  font-size:11px;
  color:#9a917f;
  margin-top:6px;
  font-family:'Space Mono',monospace;
}

.footer-tag{
  position:absolute;
  bottom:10px;
  left:0;right:0;
  text-align:center;
  font-size:10px;
  color:#b5ab98;
  font-family:'Space Mono',monospace;
  letter-spacing:1px;
}
</style>
</head>
<body>

<div class="console" id="console">
  <div class="hud">
    <div class="brand"><span class="dot"></span> FRESHBITE</div>
    <div class="stats">
      <span>SCORE<b id="hudScore">0</b></span>
      <span>BEST<b id="hudBest">0</b></span>
    </div>
    <button class="mute-btn" id="muteBtn" title="Toggle sound">🔊</button>
  </div>
  <div class="screen" id="screen"></div>
</div>

<script>
/* =========================================================
   4.3 GAME ENGINE — reference implementation
   Modules: CampaignLoader, StateMachine, AssetManager(stub),
   GameLogicEngine, TimerEngine, ScoreEngine, RuleEngine,
   RewardEngine, AudioEngine, AnalyticsEngine, SaveManager
   ========================================================= */

/* ---------- 1. Campaign Loader ---------- */
const CampaignLoader = {
  config: null,
  load(json){
    this.config = json;
    AnalyticsEngine.track('campaign_loaded', {campaign:json.campaign});
    return this.config;
  }
};

const CAMPAIGN_CONFIG = {
  campaign: "Summer Crunch Hunt",
  brand: "FreshBite",
  game: "Brand Memory Match",
  difficulty: "Medium",
  timer: 60,
  theme: "Summer",
  pairsCount: 8,
  products: ["🍟","🍫","🍿","🥨","🍭","🧃","🍪","🍩"],
  rewardTiers: [
    { minScore: 1400, coupon: "FRESH25", label: "25% OFF — Grand Win" },
    { minScore: 900,  coupon: "FRESH15", label: "15% OFF — Great Score" },
    { minScore: 0,    coupon: "FRESH5",  label: "5% OFF — Thanks for Playing" }
  ]
};

/* ---------- 2. State Machine ---------- */
const StateMachine = {
  state: "INIT",
  transitions: {
    INIT: ["LOADING"],
    LOADING: ["READY"],
    READY: ["PLAYING"],
    PLAYING: ["PAUSED", "COMPLETED"],
    PAUSED: ["PLAYING"],
    COMPLETED: ["REWARD"],
    REWARD: ["LEADERBOARD","READY"],
    LEADERBOARD: ["READY"]
  },
  go(next){
    const allowed = this.transitions[this.state] || [];
    if(!allowed.includes(next)){
      console.warn(`Blocked invalid transition: ${this.state} -> ${next}`);
      return false;
    }
    AnalyticsEngine.track('state_change', {from:this.state, to:next});
    this.state = next;
    Renderer.render(next);
    return true;
  }
};

/* ---------- 3. Timer Engine ---------- */
const TimerEngine = {
  duration: 0,
  remaining: 0,
  intervalId: null,
  onTick: null,
  onEnd: null,
  start(duration, onTick, onEnd){
    this.duration = duration;
    this.remaining = duration;
    this.onTick = onTick;
    this.onEnd = onEnd;
    clearInterval(this.intervalId);
    this.intervalId = setInterval(() => {
      this.remaining -= 1;
      if(this.onTick) this.onTick(this.remaining);
      if(this.remaining <= 0){
        clearInterval(this.intervalId);
        if(this.onEnd) this.onEnd();
      }
    }, 1000);
  },
  stop(){ clearInterval(this.intervalId); }
};

/* ---------- 4. Score Engine ---------- */
const ScoreEngine = {
  base: 0, speedBonus: 0, comboBonus: 0, penalty: 0,
  reset(){ this.base=0; this.speedBonus=0; this.comboBonus=0; this.penalty=0; },
  registerMatch(comboStreak, timeRemaining){
    this.base += 100;
    this.speedBonus += Math.round(timeRemaining * 0.8);
    if(comboStreak > 1) this.comboBonus += comboStreak * 20;
  },
  registerMistake(){
    this.penalty += 10;
  },
  total(){
    return Math.max(0, this.base + this.speedBonus + this.comboBonus - this.penalty);
  }
};

/* ---------- 5. Rule Engine ---------- */
const RuleEngine = {
  rules: { "Brand Memory Match": "Find all matching product pairs before time runs out." },
  describe(gameName){ return this.rules[gameName] || "Match all pairs."; }
};

/* ---------- 6. Reward Engine ---------- */
const RewardEngine = {
  evaluate(score, tiers){
    const sorted = [...tiers].sort((a,b)=>b.minScore-a.minScore);
    const tier = sorted.find(t => score >= t.minScore) || sorted[sorted.length-1];
    const code = tier.coupon + "-" + Math.random().toString(36).slice(2,6).toUpperCase();
    return { ...tier, code };
  }
};

/* ---------- 7. Audio Engine (WebAudio synth, no external files) ---------- */
const AudioEngine = {
  ctx: null, muted: false,
  init(){ if(!this.ctx) this.ctx = new (window.AudioContext||window.webkitAudioContext)(); },
  beep(freq, dur=0.09, type='sine', vol=0.05){
    if(this.muted) return;
    this.init();
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.value = vol;
    o.connect(g); g.connect(this.ctx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + dur);
    o.stop(this.ctx.currentTime + dur);
  },
  click(){ this.beep(420, 0.05, 'square', 0.03); },
  match(){ this.beep(660,0.12,'triangle',0.05); this.beep(880,0.12,'triangle',0.04); },
  wrong(){ this.beep(160,0.15,'sawtooth',0.04); },
  win(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>this.beep(f,0.15,'triangle',0.05), i*90)); }
};

/* ---------- 8. Analytics Engine ---------- */
const AnalyticsEngine = {
  events: [],
  track(name, payload){
    const e = { name, payload, t: Date.now() };
    this.events.push(e);
    console.log('[analytics]', name, payload);
  },
  summary(){
    return {
      totalEvents: this.events.length,
      matches: this.events.filter(e=>e.name==='match_correct').length,
      mistakes: this.events.filter(e=>e.name==='match_wrong').length
    };
  }
};

/* ---------- 9. Save Manager (in-memory session store) ---------- */
const SaveManager = {
  best: 0,
  history: [],
  saveResult(score, coupon){
    if(score > this.best) this.best = score;
    this.history.push({score, coupon, at: Date.now()});
  }
};

/* =========================================================
   GAME LOGIC ENGINE — Memory Match specific plugin
   ========================================================= */
const MemoryMatchGame = {
  cards: [],
  flipped: [],
  matchedCount: 0,
  comboStreak: 0,
  locked: false,

  init(config){
    const symbols = config.products.slice(0, config.pairsCount);
    let deck = [...symbols, ...symbols]
      .map((sym, i) => ({ id: i, symbol: sym, flipped:false, matched:false }));
    // shuffle
    for(let i = deck.length-1; i>0; i--){
      const j = Math.floor(Math.random()*(i+1));
      [deck[i],deck[j]] = [deck[j],deck[i]];
    }
    this.cards = deck;
    this.flipped = [];
    this.matchedCount = 0;
    this.comboStreak = 0;
    this.locked = false;
    ScoreEngine.reset();
  },

  handleInput(cardId){
    if(this.locked) return;
    const card = this.cards.find(c=>c.id===cardId);
    if(!card || card.flipped || card.matched) return;

    AudioEngine.click();
    card.flipped = true;
    this.flipped.push(card);
    Renderer.updateCard(card);

    if(this.flipped.length === 2){
      this.locked = true;
      setTimeout(()=>this.evaluatePair(), 550);
    }
  },

  evaluatePair(){
    const [a,b] = this.flipped;
    if(a.symbol === b.symbol){
      a.matched = true; b.matched = true;
      this.matchedCount++;
      this.comboStreak++;
      AudioEngine.match();
      ScoreEngine.registerMatch(this.comboStreak, TimerEngine.remaining);
      AnalyticsEngine.track('match_correct', {symbol:a.symbol, combo:this.comboStreak});
      Renderer.updateCard(a); Renderer.updateCard(b);
      Renderer.showCombo(this.comboStreak);
      Renderer.updateHud();
    } else {
      this.comboStreak = 0;
      AudioEngine.wrong();
      ScoreEngine.registerMistake();
      AnalyticsEngine.track('match_wrong', {a:a.symbol, b:b.symbol});
      Renderer.flashWrong(a,b);
      a.flipped = false; b.flipped = false;
      Renderer.updateHud();
    }
    this.flipped = [];
    this.locked = false;

    if(this.matchedCount === this.cards.length/2){
      TimerEngine.stop();
      GameSession.complete();
    }
  }
};

/* =========================================================
   GAME SESSION ORCHESTRATOR
   ========================================================= */
const GameSession = {
  start(){
    CampaignLoader.load(CAMPAIGN_CONFIG);
    StateMachine.go("LOADING");
    setTimeout(()=> StateMachine.go("READY"), 500);
  },
  play(){
    StateMachine.go("PLAYING");
    MemoryMatchGame.init(CampaignLoader.config);
    TimerEngine.start(
      CampaignLoader.config.timer,
      (remaining)=> Renderer.updateTimer(remaining),
      ()=> this.timeUp()
    );
    Renderer.render("PLAYING");
  },
  timeUp(){
    AnalyticsEngine.track('time_up', {matched: MemoryMatchGame.matchedCount});
    StateMachine.go("COMPLETED");
  },
  complete(){
    AudioEngine.win();
    StateMachine.go("COMPLETED");
  },
  claimReward(){
    const score = ScoreEngine.total();
    const reward = RewardEngine.evaluate(score, CampaignLoader.config.rewardTiers);
    SaveManager.saveResult(score, reward.code);
    StateMachine.go("REWARD");
    Renderer.render("REWARD", reward);
  },
  restart(){
    StateMachine.go("READY");
  }
};

/* =========================================================
   RENDERER — Presentation Layer
   ========================================================= */
const Renderer = {
  screenEl: document.getElementById('screen'),

  render(state, data){
    this.updateHud();
    if(state === "LOADING") return this.renderLoading();
    if(state === "READY") return this.renderReady();
    if(state === "PLAYING") return this.renderPlaying();
    if(state === "COMPLETED") return this.renderCompleted();
    if(state === "REWARD") return this.renderReward(data);
  },

  updateHud(){
    document.getElementById('hudScore').textContent = ScoreEngine.total();
    document.getElementById('hudBest').textContent = SaveManager.best;
  },

  renderLoading(){
    this.screenEl.innerHTML = `
      <div class="pouch-emoji">🍟</div>
      <div class="eyebrow">Loading Campaign</div>
      <h1 class="title">Summer Crunch Hunt</h1>
      <p class="lede">Warming up the Game Engine — assets, rules and rewards are loading…</p>
    `;
  },

  renderReady(){
    ScoreEngine.reset();
    this.screenEl.innerHTML = `
      <div class="pouch-emoji">🥨</div>
      <div class="eyebrow">FreshBite Presents</div>
      <h1 class="title">Summer Crunch Hunt</h1>
      <p class="lede">Match every FreshBite snack pair before the timer runs out to unlock a real discount coupon.</p>
      <div class="rules-list">
        <b>How to play</b><br>
        1. Tap two tiles to flip them.<br>
        2. Matching pairs stay open and score points.<br>
        3. Chain matches for a combo bonus.<br>
        4. Clear the board in <b>${CAMPAIGN_CONFIG.timer}s</b> for the best reward.
      </div>
      <button class="btn" id="startBtn">Start Game</button>
    `;
    document.getElementById('startBtn').onclick = () => GameSession.play();
  },

  renderPlaying(){
    this.screenEl.innerHTML = `
      <div class="game-wrap">
        <div class="game-topbar">
          <div class="timer-pill" id="timerPill">⏱ ${TimerEngine.remaining}s</div>
          <div class="combo-pill" id="comboPill">Combo x0</div>
        </div>
        <div class="grid" id="grid"></div>
      </div>
    `;
    const grid = document.getElementById('grid');
    grid.innerHTML = MemoryMatchGame.cards.map(c => `
      <div class="card" id="card-${c.id}" onclick="MemoryMatchGame.handleInput(${c.id})">
        <div class="card-inner">
          <div class="card-face card-front"></div>
          <div class="card-face card-back">${c.symbol}</div>
        </div>
      </div>
    `).join('');
  },

  updateCard(card){
    const el = document.getElementById(`card-${card.id}`);
    if(!el) return;
    el.classList.toggle('flipped', card.flipped);
    el.classList.toggle('matched', card.matched);
  },

  flashWrong(a,b){
    [a,b].forEach(c=>{
      const el = document.getElementById(`card-${c.id}`);
      if(!el) return;
      el.classList.add('wrong');
      setTimeout(()=>{
        el.classList.remove('wrong','flipped');
      }, 380);
    });
  },

  showCombo(streak){
    const pill = document.getElementById('comboPill');
    if(!pill) return;
    pill.textContent = `Combo x${streak}`;
    pill.classList.add('show');
    clearTimeout(this._comboTimeout);
    this._comboTimeout = setTimeout(()=>pill.classList.remove('show'), 1200);
  },

  updateTimer(remaining){
    const pill = document.getElementById('timerPill');
    if(!pill) return;
    pill.textContent = `⏱ ${remaining}s`;
    pill.classList.toggle('low', remaining <= 10);
  },

  renderCompleted(){
    const s = ScoreEngine;
    this.screenEl.innerHTML = `
      <div class="pouch-emoji">🎉</div>
      <div class="eyebrow">Round Complete</div>
      <h1 class="title">Nice Crunching!</h1>
      <div class="score-breakdown">
        <div class="row"><span>Base score</span><span>${s.base}</span></div>
        <div class="row"><span>Speed bonus</span><span>+${s.speedBonus}</span></div>
        <div class="row"><span>Combo bonus</span><span>+${s.comboBonus}</span></div>
        <div class="row"><span>Penalty</span><span>-${s.penalty}</span></div>
        <div class="row total"><span>Total</span><span>${s.total()}</span></div>
      </div>
      <button class="btn" id="claimBtn">Reveal My Reward</button>
      <div class="analytics-note">events logged: ${AnalyticsEngine.summary().totalEvents} · matches: ${AnalyticsEngine.summary().matches} · mistakes: ${AnalyticsEngine.summary().mistakes}</div>
    `;
    document.getElementById('claimBtn').onclick = () => GameSession.claimReward();
  },

  renderReward(reward){
    this.screenEl.innerHTML = `
      <div class="confetti-layer" id="confetti"></div>
      <div class="pouch-emoji">🏆</div>
      <div class="eyebrow">${reward.label}</div>
      <h1 class="title">Your Coupon Is Ready</h1>
      <div class="ticket">
        <div class="label">FreshBite · Summer Crunch Hunt</div>
        <div class="code">${reward.code}</div>
      </div>
      <p class="lede">Show this code at checkout, in-store or online, to redeem your discount.</p>
      <button class="btn" id="playAgainBtn">Play Again</button>
      <button class="btn secondary" id="leaderboardBtn">View Session Summary</button>
    `;
    document.getElementById('playAgainBtn').onclick = () => GameSession.restart();
    document.getElementById('leaderboardBtn').onclick = () => Renderer.renderLeaderboard();
    this.spawnConfetti();
  },

  renderLeaderboard(){
    StateMachine.go("LEADERBOARD");
    const rows = SaveManager.history.slice(-5).reverse().map((h,i)=>`
      <div class="row"><span>#${i+1} · ${h.coupon}</span><span>${h.score} pts</span></div>
    `).join('');
    this.screenEl.innerHTML = `
      <div class="pouch-emoji">📊</div>
      <div class="eyebrow">Session Summary</div>
      <h1 class="title">Your Recent Rounds</h1>
      <div class="score-breakdown">
        ${rows || '<div class="row"><span>No rounds yet</span><span></span></div>'}
        <div class="row total"><span>Best score</span><span>${SaveManager.best}</span></div>
      </div>
      <button class="btn" id="backBtn">Play Again</button>
    `;
    document.getElementById('backBtn').onclick = () => GameSession.restart();
  },

  spawnConfetti(){
    const layer = document.getElementById('confetti');
    if(!layer) return;
    const colors = ['#FF6B2C','#B8D93B','#E63E5C','#F0A202'];
    for(let i=0;i<26;i++){
      const p = document.createElement('div');
      p.className = 'confetti-piece';
      p.style.left = Math.random()*100 + '%';
      p.style.background = colors[i % colors.length];
      p.style.animationDuration = (1.6 + Math.random()*1.2) + 's';
      p.style.animationDelay = (Math.random()*0.4) + 's';
      layer.appendChild(p);
    }
  }
};

/* ---------- Mute toggle ---------- */
document.getElementById('muteBtn').onclick = function(){
  AudioEngine.muted = !AudioEngine.muted;
  this.textContent = AudioEngine.muted ? '🔇' : '🔊';
};

/* ---------- Boot ---------- */
window.MemoryMatchGame = MemoryMatchGame; // expose for inline onclick
GameSession.start();

/* ---------- PWA: service worker + install prompt ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(err => {
      console.warn('Service worker registration failed:', err);
    });
  });
}

let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  const btn = document.getElementById('installBtn');
  if (btn) btn.style.display = 'inline-flex';
});

function showInstallButton(){
  const hud = document.querySelector('.hud .stats');
  if(!hud || document.getElementById('installBtn')) return;
  const btn = document.createElement('button');
  btn.id = 'installBtn';
  btn.textContent = '⬇ Install';
  btn.style.cssText = 'display:none;margin-left:10px;background:var(--lime);color:var(--ink);border:none;border-radius:8px;padding:4px 8px;font-family:Manrope,sans-serif;font-size:11px;font-weight:800;cursor:pointer;';
  btn.onclick = async () => {
    if(!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    btn.style.display = 'none';
  };
  hud.appendChild(btn);
}
showInstallButton();
</script>
</body>
</html>
